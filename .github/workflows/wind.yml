# Refreshes the wind history after each GFS run and publishes it.
#
# GFS runs start at 00, 06, 12 and 18 UTC and their first twelve forecast
# hours are on NOAA's bucket about four hours later.
#
# The wind is published to this repository's GitHub Pages site. A deployment
# replaces the whole history at once, so a visitor never reads a manifest
# that points at files that are not there yet. No secrets are needed.
#
# One-time setup in a new repository: Settings → Pages → Build and
# deployment → Source: "GitHub Actions". Then run this workflow by hand
# once (Actions → Wind → Run workflow).
name: Wind

on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Third-party actions are pinned to a commit: this job's token can
      # replace the published site.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that Pages is switched on
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "GitHub Pages is not switched on for this repository." >&2
            echo "Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: cargo build --release -p upwind-tools

      # What earlier runs downloaded and published: only new valid times are
      # fetched, and the days the previous manifest listed are still here, so
      # they stay published for one more run for pages that are already open.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: wind-data-${{ github.run_id }}
          restore-keys: wind-data-

      # One failed download costs one valid time, not the whole refresh:
      # publish what was packed, then fail the job so the failure is seen.
      - id: ingest
        continue-on-error: true
        run: ./target/release/upwind ingest --data data --days 10 --jobs 4

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: hashFiles('data/wind/manifest.json') != ''
        with:
          path: data
          key: wind-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: hashFiles('data/wind/manifest.json') != ''
        with:
          path: data/wind

      - id: deploy
        if: hashFiles('data/wind/manifest.json') != ''
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Check what visitors are served
        if: hashFiles('data/wind/manifest.json') != ''
        env:
          SITE: ${{ steps.deploy.outputs.page_url }}
        run: bun scripts/check-wind-host.ts "${SITE%/}"

      # GitHub switches off scheduled workflows in a repository that has seen
      # no activity for sixty days, after a warning by email. Enabling the
      # workflow again is the usual way to restart that clock. GitHub does
      # not document that it does, so treat this as a best effort: if the
      # schedule ever stops, Actions → Wind → Enable workflow starts it again.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wind.yml/enable"

      - name: Report a failed refresh
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "upwind ingest failed; what it had packed was still published." >&2
          exit 1
