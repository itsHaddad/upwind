# Refreshes the wind history after each GFS run and publishes the site.
#
# GFS runs start at 00, 06, 12 and 18 UTC and their first twelve forecast
# hours are on NOAA's bucket about four hours later.
#
# The page and the wind are published together to GitHub Pages. A deployment
# replaces everything at once, so a visitor never reads a manifest that
# points at files that are not there yet. Nothing here needs a secret.
name: Wind

on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p upwind-tools

      # What earlier runs downloaded and published: only new valid times are
      # fetched, and the days the previous manifest listed are still here, so
      # they stay published for one more run for pages that are already open.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: wind-data-${{ github.run_id }}
          restore-keys: wind-data-

      # One failed download costs one valid time, not the whole refresh:
      # publish what was packed, then fail the job so the failure is seen.
      - id: ingest
        continue-on-error: true
        run: ./target/release/upwind ingest --data data --days 10 --jobs 4

      - uses: actions/cache/save@v4
        if: hashFiles('data/wind/manifest.json') != ''
        with:
          path: data
          key: wind-data-${{ github.run_id }}

      - name: Build the page with the wind beside it
        if: hashFiles('data/wind/manifest.json') != ''
        run: |
          bun run wasm
          bun scripts/build-web.ts
          cp -r data/wind web/dist/data
          # Files and folders starting with "_" or "." are served as they are.
          touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: hashFiles('data/wind/manifest.json') != ''
        with:
          path: web/dist

      - id: deploy
        if: hashFiles('data/wind/manifest.json') != ''
        uses: actions/deploy-pages@v4

      - name: Check what visitors are served
        if: hashFiles('data/wind/manifest.json') != ''
        run: bun scripts/check-wind-host.ts "${{ steps.deploy.outputs.page_url }}data"

      # GitHub switches off scheduled workflows in a repository that has seen
      # no activity for sixty days. Enabling the workflow again restarts that
      # clock, so the refresh keeps running without anyone touching it.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wind.yml/enable"

      - name: Report a failed refresh
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "upwind ingest failed; what it had packed was still published." >&2
          exit 1
