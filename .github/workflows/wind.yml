# Refreshes the wind history after each GFS run and publishes it.
#
# GFS runs start at 00, 06, 12 and 18 UTC and their first twelve forecast
# hours are on NOAA's bucket about four hours later.
#
# The wind is published as a Cloudflare Pages project (direct upload): a
# deployment replaces the whole history at once, so a visitor never sees a
# manifest that points at files that are not there yet, and only files that
# changed are uploaded. Needs two repository secrets and one variable:
#   secrets.CLOUDFLARE_API_TOKEN   a token that may edit Cloudflare Pages
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.WIND_PAGES_PROJECT        the name of the Pages project
name: Wind

on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wind
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo build --release -p upwind-tools

      # What earlier runs downloaded and published: only new valid times are
      # fetched, and the days the previous manifest listed are still here, so
      # they stay published for one more run for pages that are already open.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: wind-data-${{ github.run_id }}
          restore-keys: wind-data-

      # One failed download costs one valid time, not the whole refresh:
      # publish what was packed, then fail the job so the failure is seen.
      - id: ingest
        continue-on-error: true
        run: ./target/release/upwind ingest --data data --days 10 --jobs 4

      - uses: actions/cache/save@v4
        if: hashFiles('data/wind/manifest.json') != ''
        with:
          path: data
          key: wind-data-${{ github.run_id }}

      # Cloudflare Pages joins the values when two rules set the same header,
      # so each header is set by exactly one rule for any path: everything may
      # be read from other sites; the manifest is short-lived; a file inside
      # a day directory (day/band/tile) never changes.
      - name: Say how the files may be cached and who may read them
        if: hashFiles('data/wind/manifest.json') != ''
        run: |
          cat > data/wind/_headers <<'HEADERS'
          /*
            Access-Control-Allow-Origin: *
          /manifest.json
            Cache-Control: public, max-age=60
          /:day/:band/:file
            Cache-Control: public, max-age=31536000, immutable
          HEADERS
          # Without this, Pages answers a missing file with a page and status
          # 200, and the page could not tell that its manifest is out of date.
          echo "Not found" > data/wind/404.html

      - name: Publish
        if: hashFiles('data/wind/manifest.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.WIND_PAGES_PROJECT }}
        run: bunx wrangler@4 pages deploy data/wind --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Check what visitors are served
        if: hashFiles('data/wind/manifest.json') != ''
        env:
          SITE: https://${{ vars.WIND_PAGES_PROJECT }}.pages.dev
        run: bun scripts/check-wind-host.ts "$SITE"

      - name: Report a failed refresh
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "upwind ingest failed; what it had packed was still published." >&2
          exit 1
