<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Upwind — where has your air been?</title>
    <meta
      name="description"
      content="Type any place and watch where the air above it has been for the last ten days, traced through real wind data in your browser."
    />
    <meta name="theme-color" content="#04070d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23081326'/%3E%3Cpath d='M5 21c6-1 8-9 14-9 3 0 5 2 8 2' fill='none' stroke='%23ffd9a0' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='14' r='2.6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="globe" aria-label="A globe showing the path the air took"></canvas>
    <div id="labels" aria-hidden="true">
      <div id="pin" class="marker" hidden><i></i><span></span></div>
      <div id="head" class="marker" hidden><i></i><span></span></div>
    </div>

    <header>
      <a class="wordmark" href="./">upwind</a>
      <search><form id="search" autocomplete="off">
        <input
          id="query"
          type="search"
          placeholder="Type a place"
          aria-label="Place"
          aria-controls="suggestions"
          enterkeyhint="search"
          spellcheck="false"
        />
        <button id="locate" type="button" title="Use my location" aria-label="Use my location">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" fill="currentColor" />
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div id="suggestions" role="listbox" tabindex="-1" hidden></div>
        </form></search>
    </header>

    <main id="panel">
      <p id="kicker">Where has your air been?</p>
      <h1 id="headline">Pick any place on Earth and follow the air above it back through the last ten days.</h1>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="result" hidden>
        <dl id="facts">
          <div><dt>Travelled</dt><dd id="fact-distance"></dd></div>
          <div><dt>Highest</dt><dd id="fact-peak"></dd></div>
          <div><dt>Fastest</dt><dd id="fact-speed"></dd></div>
        </dl>
        <div id="timeline">
          <button id="play" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path id="play-icon" d="M7 4l14 8-14 8z" fill="currentColor" /></svg>
          </button>
          <input id="scrub" type="range" min="0" max="240" value="0" step="1" aria-label="Hours back in time" />
        </div>
        <p id="moment"></p>
        <button id="share" type="button">Share this path</button>
        <ol id="legs"></ol>
      </div>
      <footer>
        <span id="source">Wind from NOAA's GFS model.</span>
        <a href="./about.html">How it works</a>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
